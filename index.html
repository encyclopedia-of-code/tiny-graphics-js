<!-- Graphics Example Code.
index.html - The web page document containing the canvas (drawing surface).  It launches your JavaScript files. //-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" href="assets/fav.ico">
    <title>WebGL</title></head>
<body style="background: DarkGray">
<!-- Begin typing your web page's text here. //-->

<!-- The following code embeds a WebGL canvas panel powered by a tree of Components from tiny-graphics.  //-->
<div id="main-section" class="document-builder"></div>
<script type=module>
// ********************* THE ENTRY POINT OF YOUR JAVASCRIPT PROGRAM STARTS HERE *********************
// Indicate which element on the page you want the Canvas_Widget to replace with a 3D WebGL area:
const element_to_replace = document.querySelector ("#main-section");
export * from './tiny-graphics.js';
export * from './examples/common.js';
import { load_scene, main_scene_name, additional_scene_names } from './scene-manifest.js';
Promise.all([
  load_scene(main_scene_name),
  ...additional_scene_names.map(load_scene)
]).then(([Main_Scene_Class, ...Additional_Scene_Classes]) => {
  const root = new Main_Scene_Class();                    // This line creates your scene.
  root.animated_children.push(...Additional_Scene_Classes.map(Scene => new Scene()));
      const options = {
         // show_canvas: true, make_controls: false,
         // make_editor: false, make_code_nav: false
      };
  root.render_layout(element_to_replace, options);
});
</script>

</body>
</html>
